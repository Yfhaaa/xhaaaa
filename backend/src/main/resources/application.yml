server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
